<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses JSON Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --surface2: #161b2a;
      --border: rgba(255,255,255,0.07);
      --accent1: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6b9d;
      --accent4: #ffa94d;
      --accent5: #4ecdc4;
      --text: #e8eaf0;
      --text-muted: #7a849a;
      --beginner: #00d4aa;
      --intermediate: #ffa94d;
      --advanced: #ff6b6b;
      --glow1: rgba(108,99,255,0.15);
      --glow2: rgba(0,212,170,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .blob1 { width: 600px; height: 600px; background: var(--glow1); top: -200px; left: -200px; }
    .blob2 { width: 400px; height: 400px; background: var(--glow2); bottom: -100px; right: -100px; }
    main { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
    header { text-align: center; margin-bottom: 56px; animation: fadeDown 0.6s ease both; }
    header .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.3);
      padding: 5px 14px; border-radius: 100px;
      font-size: 12px; font-weight: 600; color: var(--accent1);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 18px;
    }
    header h1 {
      font-size: clamp(28px, 5vw, 52px); font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--accent1) 50%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.1;
    }
    header p { margin-top: 12px; color: var(--text-muted); font-size: 15px; }
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 48px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px 20px; position: relative; overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: fadeUp 0.5s ease both;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent-color, var(--accent1));
    }
    .stat-icon { font-size: 26px; margin-bottom: 12px; }
    .stat-val { font-size: 38px; font-weight: 800; color: var(--accent-color, var(--accent1)); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .section-title {
      font-size: 20px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .courses-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px; margin-bottom: 48px;
    }
    .course-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 24px; position: relative; overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeUp 0.5s ease both;
    }
    .course-card:hover { transform: translateY(-6px); box-shadow: 0 24px 60px rgba(0,0,0,0.5); border-color: rgba(108,99,255,0.3); }
    .course-card .card-glow {
      position: absolute; top: -60px; right: -60px;
      width: 180px; height: 180px; border-radius: 50%;
      background: var(--card-color, var(--accent1));
      opacity: 0.08; filter: blur(50px); transition: opacity 0.3s;
    }
    .course-card:hover .card-glow { opacity: 0.15; }
    .course-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .course-title { font-size: 17px; font-weight: 700; line-height: 1.3; flex: 1; padding-right: 12px; }
    .level-badge {
      padding: 4px 10px; border-radius: 100px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    }
    .level-beginner     { background: rgba(0,212,170,0.12); color: var(--beginner); border: 1px solid rgba(0,212,170,0.25); }
    .level-intermediate { background: rgba(255,169,77,0.12); color: var(--intermediate); border: 1px solid rgba(255,169,77,0.25); }
    .level-advanced     { background: rgba(255,107,107,0.12); color: var(--advanced); border: 1px solid rgba(255,107,107,0.25); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .tag {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 100px; font-size: 11px; color: var(--text-muted); font-weight: 500;
    }
    .course-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cs-item { background: var(--surface2); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .cs-val { font-size: 22px; font-weight: 700; color: var(--card-color, var(--accent1)); }
    .cs-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
    .chart-section {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px; margin-bottom: 48px; animation: fadeUp 0.6s ease both;
    }
    .bar-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .bar-label { width: 200px; font-size: 13px; font-weight: 500; text-align: right; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 32px; background: var(--surface2); border-radius: 8px; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 8px; background: var(--bar-color, var(--accent1));
      width: 0; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); position: relative;
    }
    .bar-fill::after {
      content: attr(data-val); position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.9);
    }
    .bar-sub { font-size: 11px; color: var(--text-muted); width: 40px; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 48px; }
    @media (max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }
    .donut-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px; animation: fadeUp 0.6s ease both; display: flex; flex-direction: column;
    }
    .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 32px; flex: 1; margin-top: 16px; }
    .donut-legend { display: flex; flex-direction: column; gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-val { font-weight: 700; margin-left: auto; padding-left: 12px; }
    .hours-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; margin-top: 16px; }
    .hbar {
      flex: 1; border-radius: 8px 8px 0 0; background: var(--bar-color);
      height: 0; transition: height 1.2s cubic-bezier(0.16,1,0.3,1);
      display: flex; align-items: flex-start; justify-content: center; padding-top: 8px;
    }
    .hbar-val { font-size: 12px; font-weight: 700; color: #fff; }
    .table-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; margin-bottom: 48px; animation: fadeUp 0.6s ease both;
    }
    .table-header { padding: 24px 28px 16px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 20px;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 20px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .progress-cell { display: flex; align-items: center; gap: 10px; }
    .mini-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
    .mini-bar-fill { height: 100%; border-radius: 100px; background: var(--bar-color); width: 0; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
    .mini-val { font-size: 12px; font-weight: 600; color: var(--text); min-width: 28px; text-align: right; }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(24px);  } to { opacity:1; transform:translateY(0); } }
    .stat-card:nth-child(1){animation-delay:.05s}.stat-card:nth-child(2){animation-delay:.10s}
    .stat-card:nth-child(3){animation-delay:.15s}.stat-card:nth-child(4){animation-delay:.20s}
    .stat-card:nth-child(5){animation-delay:.25s}
    .course-card:nth-child(1){animation-delay:.05s}.course-card:nth-child(2){animation-delay:.10s}
    .course-card:nth-child(3){animation-delay:.15s}.course-card:nth-child(4){animation-delay:.20s}
    .course-card:nth-child(5){animation-delay:.25s}.course-card:nth-child(6){animation-delay:.30s}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:10px}
  </style>
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<main>
  <header>
    <div class="badge">📊 JSON Analyzer</div>
    <h1>courses.json Dashboard</h1>
    <p>Interactive breakdown of all courses, modules, lessons, quizzes &amp; challenges.</p>
  </header>
  <div class="stat-grid" id="statGrid"></div>
  <div class="section-title">🎓 Courses Overview</div>
  <div class="courses-grid" id="coursesGrid"></div>
  <div class="chart-section">
    <div class="section-title">📚 Lessons per Course</div>
    <div id="lessonsBar"></div>
  </div>
  <div class="charts-row">
    <div class="donut-card">
      <div class="section-title" style="margin-bottom:0">🎯 Difficulty Distribution</div>
      <div class="donut-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140" id="donutSvg" style="overflow:visible"></svg>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
    <div class="donut-card">
      <div class="section-title" style="margin-bottom:0">⏱️ Estimated Hours per Course</div>
      <div style="display:flex;flex-direction:column;flex:1">
        <div class="hours-chart" id="hoursChart"></div>
        <div style="display:flex;gap:12px;margin-top:8px" id="hoursLabels"></div>
      </div>
    </div>
  </div>
  <div class="table-card">
    <div class="table-header"><div class="section-title" style="margin-bottom:0">📋 Full Course Breakdown</div></div>
    <table>
      <thead>
        <tr>
          <th>Course</th><th>Level</th><th>Modules</th><th>Lessons</th>
          <th>Quizzes</th><th>Challenges</th><th>Hours</th><th>Lessons %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>
<script>
const courses = [
  {title:"HTML, CSS & JavaScript",level:"beginner",hours:45,tags:["Web","Frontend","HTML","CSS","JavaScript"],modules:10,lessons:60,quizzes:63,challenges:60},
  {title:"Python for Beginners",level:"beginner",hours:30,tags:["Python","Backend","Data"],modules:1,lessons:10,quizzes:10,challenges:10},
  {title:"MySQL Database Mastery",level:"intermediate",hours:20,tags:["MySQL","SQL","Database"],modules:1,lessons:10,quizzes:10,challenges:10},
  {title:"C# Fundamentals",level:"beginner",hours:40,tags:["C#",".NET","GameDev"],modules:1,lessons:10,quizzes:10,challenges:10},
  {title:"C++ Programming",level:"advanced",hours:50,tags:["C++","System","Advanced"],modules:1,lessons:10,quizzes:10,challenges:10},
  {title:"The C Programming Language",level:"intermediate",hours:35,tags:["C","Low-level","Pointers"],modules:1,lessons:10,quizzes:10,challenges:10},
];
const COLORS = ['#6c63ff','#00d4aa','#ffa94d','#ff6b9d','#4ecdc4','#ff6b6b'];
const LEVEL_COLORS = {beginner:'#00d4aa',intermediate:'#ffa94d',advanced:'#ff6b6b'};

// KPIs
const kpis = [
  {icon:'📦',val:courses.length,label:'Total Courses',color:'#6c63ff'},
  {icon:'📖',val:courses.reduce((s,c)=>s+c.lessons,0),label:'Total Lessons',color:'#00d4aa'},
  {icon:'🧩',val:courses.reduce((s,c)=>s+c.quizzes,0),label:'Total Quizzes',color:'#ffa94d'},
  {icon:'⚡',val:courses.reduce((s,c)=>s+c.challenges,0),label:'Challenges',color:'#ff6b9d'},
  {icon:'⏱️',val:courses.reduce((s,c)=>s+c.hours,0),label:'Hours of Content',color:'#4ecdc4'},
];
const sg = document.getElementById('statGrid');
kpis.forEach(k=>{
  sg.innerHTML+=`<div class="stat-card" style="--accent-color:${k.color}"><div class="stat-icon">${k.icon}</div><div class="stat-val" id="kv_${k.label.replace(/\s/g,'_')}">0</div><div class="stat-label">${k.label}</div></div>`;
});
function countUp(el,target){let s=0;const t=setInterval(()=>{s=Math.min(s+target/60,target);el.textContent=Math.floor(s);if(s>=target)clearInterval(t);},16);}
setTimeout(()=>kpis.forEach(k=>{const e=document.getElementById('kv_'+k.label.replace(/\s/g,'_'));if(e)countUp(e,k.val);}),300);

// Course cards
const cg=document.getElementById('coursesGrid');
courses.forEach((c,i)=>{
  const color=COLORS[i], lc=`level-${c.level}`;
  cg.innerHTML+=`<div class="course-card" style="--card-color:${color}"><div class="card-glow" style="background:${color}"></div><div class="course-header"><div class="course-title">${c.title}</div><span class="level-badge ${lc}">${c.level}</span></div><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="course-stats"><div class="cs-item"><div class="cs-val">${c.modules}</div><div class="cs-label">Modules</div></div><div class="cs-item"><div class="cs-val">${c.lessons}</div><div class="cs-label">Lessons</div></div><div class="cs-item"><div class="cs-val">${c.hours}h</div><div class="cs-label">Est. Time</div></div></div></div>`;
});

// Lessons bar chart
const maxL=Math.max(...courses.map(c=>c.lessons));
const lb=document.getElementById('lessonsBar');
courses.forEach((c,i)=>{
  const pct=(c.lessons/maxL*100).toFixed(1);
  lb.innerHTML+=`<div class="bar-row"><div class="bar-label" title="${c.title}">${c.title}</div><div class="bar-track"><div class="bar-fill" data-val="${c.lessons}" data-pct="${pct}%" style="--bar-color:${COLORS[i]}"></div></div><div class="bar-sub">${c.lessons}</div></div>`;
});
setTimeout(()=>document.querySelectorAll('.bar-fill').forEach(e=>e.style.width=e.dataset.pct),400);

// Donut
const lc={};courses.forEach(c=>{lc[c.level]=(lc[c.level]||0)+1;});
const ds=document.getElementById('donutSvg'),dl=document.getElementById('donutLegend');
const cx=70,cy=70,r=52,sw=22,tot=courses.length;let cum=-90;
Object.entries(lc).forEach(([lvl,cnt])=>{
  const ang=(cnt/tot)*360,sr=cum*Math.PI/180,er=(cum+ang)*Math.PI/180,la=ang>180?1:0;
  const x1=cx+r*Math.cos(sr),y1=cy+r*Math.sin(sr),x2=cx+r*Math.cos(er),y2=cy+r*Math.sin(er);
  const col=LEVEL_COLORS[lvl]||'#888';
  ds.innerHTML+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${la} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  dl.innerHTML+=`<div class="legend-item"><span class="legend-dot" style="background:${col}"></span><span>${lvl.charAt(0).toUpperCase()+lvl.slice(1)}</span><span class="legend-val" style="color:${col}">${cnt}</span></div>`;
  cum+=ang;
});
ds.innerHTML+=`<text x="70" y="66" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Inter">${tot}</text><text x="70" y="82" text-anchor="middle" fill="#7a849a" font-size="10" font-weight="500" font-family="Inter">COURSES</text>`;

// Hours chart
const maxH=Math.max(...courses.map(c=>c.hours));
const hc=document.getElementById('hoursChart'),hl=document.getElementById('hoursLabels');
courses.forEach((c,i)=>{
  const pct=(c.hours/maxH*100).toFixed(1);
  hc.innerHTML+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div class="hbar" data-h="${pct}%" style="--bar-color:${COLORS[i]};width:100%;height:0"><span class="hbar-val">${c.hours}h</span></div></div>`;
  const short=c.title.split(' ').pop().replace(/[^a-zA-Z+#]/g,'');
  hl.innerHTML+=`<div style="flex:1;text-align:center;font-size:10px;color:var(--text-muted);font-weight:500">${short}</div>`;
});
setTimeout(()=>document.querySelectorAll('.hbar').forEach(e=>e.style.height=e.dataset.h),500);

// Table
const tb=document.getElementById('tableBody');
courses.forEach((c,i)=>{
  const pct=Math.round(c.lessons/maxL*100);
  tb.innerHTML+=`<tr><td><strong>${c.title}</strong></td><td><span class="level-badge level-${c.level}">${c.level}</span></td><td>${c.modules}</td><td>${c.lessons}</td><td>${c.quizzes}</td><td>${c.challenges}</td><td><strong>${c.hours}h</strong></td><td><div class="progress-cell"><div class="mini-bar"><div class="mini-bar-fill" data-pct="${pct}%" style="--bar-color:${COLORS[i]}"></div></div><span class="mini-val">${pct}%</span></div></td></tr>`;
});
setTimeout(()=>document.querySelectorAll('.mini-bar-fill').forEach(e=>e.style.width=e.dataset.pct),600);
</script>
</body>
</html>
